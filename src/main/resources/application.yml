spring:
  application:
    name: taskmaster-bot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskmaster}
    username: ${DB_USERNAME:taskmaster}
    password: ${DB_PASSWORD:taskmaster}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

telegram:
  bot:
    username: ${TELEGRAM_BOT_USERNAME:}
    token: ${TELEGRAM_BOT_TOKEN:}

application:
  time-zone: ${APP_TIME_ZONE:Asia/Baku}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.github.taskmasterbot: ${APP_LOG_LEVEL:INFO}
